# Optional override: HTTPS served directly by Sentinel via Caddy, using a
# locally-trusted-only self-signed certificate (Caddy's internal CA) rather
# than Let's Encrypt. Opt in with:
#   docker compose -f docker-compose.yml -f docker-compose.caddy-selfsigned.yml up -d
# install.sh does this for you and remembers the choice by writing
# COMPOSE_FILE into .env, so a later plain `docker compose ...` still
# includes this file automatically.
#
# Unlike docker-compose.caddy.yml (the Let's Encrypt variant), this publishes
# ONLY one port. A self-signed cert has no external CA to satisfy - no
# HTTP-01 challenge, no requirement that anything run on port 80 - so there
# is nothing to gain from a separate plain-HTTP listener, and publishing one
# anyway would need two different host ports for one deployment for no
# reason. HTTPS_PORT is the only port this deployment uses: set it to
# whatever you want (3000, 443, anything) and that is the port you browse
# to, directly over HTTPS - e.g. HTTPS_PORT=3000 means https://<host>:3000.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.caddy
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-frontend-caddy:${IMAGE_TAG:-latest}
    environment:
      # Required in both TLS_MODE values - see .env.example.
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to use Caddy HTTPS mode}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    # Compose MERGES (concatenates) a list-type key like this one across
    # files by default - it does NOT replace it, even when an override
    # restates it (confirmed empirically: an override with a genuinely
    # different port list ends up with both the base's and the override's
    # entries present, not just the override's). The base file's own
    # frontend service always publishes some "${FRONTEND_PORT:-3000}:80"
    # mapping, which would otherwise still show up here alongside this
    # one - defeating the entire point of this file (one port, nothing
    # else). !override is the Compose-spec escape hatch that forces a true
    # replacement instead of a merge for this one field.
    ports: !override
      - "${HTTPS_PORT:-443}:443"
    # This check runs inside the container (CMD-SHELL), so it always talks
    # to Caddy's own internal port 443 regardless of what host port
    # HTTPS_PORT maps to externally - same command as the Let's Encrypt
    # variant, host-port-agnostic. See that file for the SNI/$$ explanation.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk --resolve \"$$DOMAIN:443:127.0.0.1\" \"https://$$DOMAIN/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Caddy's cert/state storage, so a recreated container reuses its
      # already-issued self-signed cert instead of generating a new one
      # (which would need re-trusting again on every recreation).
      - caddy_data:/data

volumes:
  caddy_data:
