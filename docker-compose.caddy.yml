# Optional override: HTTPS served directly by Sentinel via Caddy, instead of
# nginx behind an external proxy (or no TLS at all). Opt in with:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# install.sh does this for you and remembers the choice by writing
# COMPOSE_FILE into .env, so a later plain `docker compose ...` still
# includes this file automatically.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.caddy
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-frontend-caddy:${IMAGE_TAG:-latest}
    environment:
      # Required in both TLS_MODE values - see .env.example.
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to use Caddy HTTPS mode}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    # Compose MERGES (concatenates) a list-type key like this one across
    # files by default, rather than replacing it - confirmed empirically.
    # Restating the base file's own "${FRONTEND_PORT:-3000}:80" entry here
    # happens to be harmless (an identical duplicate mapping is a no-op),
    # but !override is used anyway so this doesn't silently depend on that
    # coincidence - if the base file's default ever changes, this still
    # ends up with exactly these two entries, not three.
    ports: !override
      - "${FRONTEND_PORT:-3000}:80"
      - "${HTTPS_PORT:-443}:443"
    # nginx.conf's healthcheck curls plain HTTP; this container only serves
    # HTTPS (Caddy's automatic HTTP->HTTPS redirect answers :80 with a
    # redirect, not a 200), so the check itself must switch to HTTPS too.
    # Curling by bare IP sends no SNI matching the {$DOMAIN}-keyed site
    # block, so Caddy can't select a cert and the handshake fails - the
    # check must present the actual DOMAIN via --resolve instead. $$ is
    # Compose's escape for a literal $, so $DOMAIN is read by the
    # container's own shell (CMD-SHELL), not substituted by Compose.
    # start_period is longer than the base file's: in letsencrypt mode
    # nothing is servable on 443 until ACME issuance finishes.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk --resolve \"$$DOMAIN:443:127.0.0.1\" \"https://$$DOMAIN/health\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      # Caddy's cert/state storage, so a recreated container reuses an
      # already-issued certificate instead of requesting a new one - Let's
      # Encrypt rate-limits issuance per domain.
      - caddy_data:/data

volumes:
  caddy_data:
