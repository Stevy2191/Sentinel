user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # This container itself only ever listens on plain HTTP (port 80) TLS, if
  # any, is terminated by an external reverse proxy the operator puts in
  # front. Strict-Transport-Security is only meaningful (and only honored by
  # browsers) over an actual HTTPS connection, so it's emitted only when a
  # fronting proxy tells us the original request was HTTPS via
  # X-Forwarded-Proto. Sent over plain HTTP, browsers ignore it anyway, but
  # omitting it there keeps behavior sensible for the common LAN/no-TLS case.
  map $http_x_forwarded_proto $hsts_header {
    https "max-age=63072000; includeSubDomains";
    default "";
  }

  map $http_x_forwarded_proto $proxy_x_fwd_proto {
      default $http_x_forwarded_proto;
      ''      $scheme;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers, applied to every response from this server (both the
    # SPA's static files and, via inheritance, the /api/ proxy below - neither
    # location block defines its own add_header, so these carry through).
    #
    # script-src has no 'unsafe-inline'/'unsafe-eval': the app has no inline
    # <script> (see theme-init.js) and no eval-like usage.
    # style-src needs 'unsafe-inline': the app sets React inline style={{...}}
    # props extensively for per-component theming (CSS custom properties),
    # which CSP's style-src governs the same as a literal style="" attribute.
    # connect-src/img-src/font-src are 'self' only. No external CDN, fonts,
    # or API host are used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
    # Legacy header superseded by CSP's script-src/style-src etc. Modern
    # browsers ignore it; kept only for very old clients that don't support
    # CSP at all, so it costs nothing to include as a fallback.
    add_header X-XSS-Protection "0" always;

    # Liveness probe for the compose healthcheck. Declared before the SPA
    # fallback so it answers here instead of being served index.html by
    # try_files, which returned 200 text/html for any path and made the
    # healthcheck pass no matter what nginx was serving.
    location = /health {
      access_log off;
      # default_type rather than add_header: defining any add_header in a
      # location cancels inheritance of the server-level security headers
      # above, which is the invariant their comment relies on.
      default_type text/plain;
      return 200 'ok';
    }

    # SPA routing: all non-file requests go to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (the backend listens on PORT 3001 in docker-compose).
    # This also carries the public status page JSON at /api/v1/public/status/:slug.
    # The human-facing /public/status/:slug URL is intentionally NOT proxied — it
    # is served by the SPA (try_files above) so the React app renders there.
    location /api/ {
      # Resolved per request, not at config load. A literal hostname in
      # proxy_pass is resolved once at startup, so nginx exited with
      # "host not found in upstream" whenever the backend container was
      # absent - taking the whole web UI down with it, and blaming a hostname
      # rather than the service that actually failed. Going through a variable
      # defers the lookup, so nginx boots regardless and returns 502 per
      # request until the backend is up.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $sentinel_api http://backend:3001;
      # IMPORTANT: $sentinel_api must be a bare scheme+host, no path suffix.
      # proxy_pass built from a variable skips nginx's normal location-prefix
      # substitution, so any path added here (e.g. "$sentinel_api/api/") gets
      # the full $request_uri appended after it verbatim, doubling the /api/
      # prefix on every request (this doubling is exactly what broke login
      # previously - see PR #[this-PR-number]). $request_uri already carries
      # the original path and query string unchanged, which is correct since
      # nothing needs stripping here.
      proxy_pass $sentinel_api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $proxy_x_fwd_proto;
    }
  }
}
