user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe for the compose healthcheck. Declared before the SPA
    # fallback so it answers here instead of being served index.html by
    # try_files, which returned 200 text/html for any path and made the
    # healthcheck pass no matter what nginx was serving.
    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # SPA routing: all non-file requests go to index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (the backend listens on PORT 3001 in docker-compose).
    # This also carries the public status page JSON at /api/v1/public/status/:slug.
    # The human-facing /public/status/:slug URL is intentionally NOT proxied — it
    # is served by the SPA (try_files above) so the React app renders there.
    location /api/ {
      # Resolved per request, not at config load. A literal hostname in
      # proxy_pass is resolved once at startup, so nginx exited with
      # "host not found in upstream" whenever the backend container was
      # absent - taking the whole web UI down with it, and blaming a hostname
      # rather than the service that actually failed. Going through a variable
      # defers the lookup, so nginx boots regardless and returns 502 per
      # request until the backend is up.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $sentinel_api http://backend:3001;
      proxy_pass $sentinel_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
