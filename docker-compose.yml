services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file before starting Sentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Localhost-only by default: the backend reaches Postgres over the
      # internal Docker network regardless of this binding, so this only
      # controls host/external access (e.g. for local psql). Override with a
      # specific interface if you genuinely need remote DB access, rather
      # than opening it to every interface.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # `build` lets `docker compose up` build locally; `image` names the tag that
    # CI builds/pushes (so `docker compose pull` also works once published).
    build:
      context: ./backend
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-backend:${IMAGE_TAG:-latest}
    container_name: sentinel-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinel
      DB_USER: sentinel
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file before starting Sentinel}
      PORT: 3001
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TIMEZONE: ${TIMEZONE:-UTC}
      REPORTS_DIR: /app/reports
      # Used for links in scheduled report email.
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Initial state of self-registration (seeded on first run; an admin can
      # change it at runtime and that persists regardless of this value).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # none | starttls | ssltls. Falls back to the legacy SMTP_TLS bool if unset.
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_SKIP_TLS_VERIFY: ${SMTP_SKIP_TLS_VERIFY:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/migrations:/app/migrations
      # Generated report PDFs, kept on the host so they survive a container
      # replacement. REPORTS_DIR must match the container-side path.
      - ./reports:/app/reports
    # CAP_NET_RAW lets the backend open raw ICMP sockets for ping monitor
    # checks and network discovery scans. Without it, both fall back to
    # unprivileged ICMP (if the host's ping_group_range allows it) or a TCP
    # connect probe, which still works but is less accurate.
    cap_add:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-frontend:${IMAGE_TAG:-latest}
    container_name: sentinel-frontend
    # The browser reaches the API through nginx (relative /api), which proxies to
    # the backend service — so no build-time API URL is needed here.
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer:latest
    container_name: sentinel-adminer
    # Gated behind the "adminer" compose profile: it starts only when the
    # profile is active (COMPOSE_PROFILES=adminer in .env, set by install.sh, or
    # `docker compose --profile adminer up`). Omit the profile to skip it.
    profiles: ["adminer"]
    depends_on:
      - postgres
    ports:
      # Bound to localhost only: Adminer has no auth of its own beyond the
      # Postgres password, so it should never be reachable from the network,
      # only from the host itself (e.g. via an SSH tunnel). If you need
      # remote access, tunnel in rather than widening this binding.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  postgres_data:
