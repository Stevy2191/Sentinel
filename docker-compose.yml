services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file before starting Sentinel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to loopback: nothing in the stack needs host access to Postgres -
    # the backend reaches it over the compose network. Publishing on 0.0.0.0
    # exposed the database to the network, with "changeme" as the compose
    # default password. Override DB_BIND to 0.0.0.0 only if you truly need it.
    ports:
      # Localhost-only by default: the backend reaches Postgres over the
      # internal Docker network regardless of this binding, so this only
      # controls host/external access (e.g. for local psql). Override with a
      # specific interface if you genuinely need remote DB access, rather
      # than opening it to every interface.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      # -U sentinel matches POSTGRES_USER above. pg_isready only tests whether
      # the server is accepting connections, so the role name is advisory.
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    # `build` lets `docker compose up` build locally; `image` names the tag that
    # CI builds/pushes (so `docker compose pull` also works once published).
    build:
      context: ./backend
      args:
        # Set GOPROXY in .env for a mirrored or firewalled build network.
        # Compose passes this explicitly, so this default - not the Dockerfile's
        # ARG default - is what a `docker compose build` actually uses.
        GOPROXY: ${GOPROXY:-https://goproxy.cn,https://proxy.golang.org,direct}
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-backend:${IMAGE_TAG:-latest}
    container_name: sentinel-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sentinel
      DB_USER: sentinel
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file before starting Sentinel}
      PORT: 3001
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TIMEZONE: ${TIMEZONE:-UTC}
      REPORTS_DIR: /app/reports
      # Used for links in outgoing email. Seeds the stored setting on first run
      # only; after that Settings -> System in the web UI is authoritative.
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-}
      # Instance display name, also seed-once. Empty leaves it as "Sentinel".
      APP_NAME: ${APP_NAME:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Initial state of self-registration (seeded on first run; an admin can
      # change it at runtime and that persists regardless of this value).
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Recipient list for alert email. Without it every alert goes only to
      # SMTP_USER, silently, no matter what .env says.
      SMTP_TO: ${SMTP_TO:-}
      # Legacy boolean, still read as a fallback when SMTP_SECURITY is unset.
      SMTP_TLS: ${SMTP_TLS:-}
      # none | starttls | ssltls. Falls back to the legacy SMTP_TLS bool if unset.
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_SKIP_TLS_VERIFY: ${SMTP_SKIP_TLS_VERIFY:-false}
      # Legacy alert-channel variables, kept so existing installs keep working.
      # Read on first run only and imported as ordinary channels; new installs
      # add channels under Settings -> Notifications instead.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      NOTIFICATION_SECRET_KEY: ${NOTIFICATION_SECRET_KEY:-}
      # Tuning knobs that previously had no way in from .env.
      DEFAULT_CHECK_INTERVAL: ${DEFAULT_CHECK_INTERVAL:-30}
      REPORT_WORKERS: ${REPORT_WORKERS:-2}
      # Where database backups are written. Must match the volume below.
      BACKUP_DIR: ${BACKUP_DIR:-/var/lib/sentinel/backups}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/migrations:/app/migrations
      # Generated report PDFs, kept on the host so they survive a container
      # replacement. REPORTS_DIR must match the container-side path.
      - ./reports:/app/reports
      # Database backups. A named volume rather than a bind mount: these files
      # contain every credential in the database, and a named volume keeps the
      # restrictive permissions the backend sets instead of inheriting whatever
      # the host directory allows.
      - sentinel_backups:/var/lib/sentinel/backups
    # CAP_NET_RAW lets the backend open raw ICMP sockets for ping monitor
    # checks and network discovery scans. Without it, both fall back to
    # unprivileged ICMP (if the host's ping_group_range allows it) or a TCP
    # connect probe, which still works but is less accurate.
    cap_add:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      # Port 3001 and path /health are what the backend actually serves
      # (PORT above, and router.GET("/health") in cmd/sentinel/main.go).
      # start_period covers migrations on first boot so a slow start is not
      # counted as a failure.
      # 127.0.0.1 rather than localhost, for the same resolution reason as the
      # frontend check below.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: ${DOCKER_REGISTRY:-ghcr.io}/stevy2191/sentinel-frontend:${IMAGE_TAG:-latest}
    container_name: sentinel-frontend
    # The browser reaches the API through nginx (relative /api), which proxies to
    # the backend service — so no build-time API URL is needed here.
    depends_on:
      # Wait for a healthy backend, not merely a started one. nginx also
      # resolves the upstream lazily now (see nginx.conf), so this is belt and
      # braces rather than the only thing keeping the frontend alive.
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      # /health is a real nginx location, not the SPA fallback, so this check
      # fails if nginx stops serving rather than passing on any response.
      #
      # 127.0.0.1, NOT localhost. nginx listens on 0.0.0.0:80 (IPv4 only), while
      # the container's /etc/hosts maps localhost to both 127.0.0.1 and ::1.
      # BusyBox wget tries ::1 first, is refused, and does not fall back — so
      # the check failed permanently while nginx was serving perfectly.
      # The base image's 10-listen-on-ipv6-by-default.sh does not help here: it
      # patches conf.d/default.conf, which our own nginx.conf never includes.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  adminer:
    image: adminer:latest
    container_name: sentinel-adminer
    # Gated behind the "adminer" compose profile: it starts only when the
    # profile is active (COMPOSE_PROFILES=adminer in .env, set by install.sh, or
    # `docker compose --profile adminer up`). Omit the profile to skip it.
    profiles: ["adminer"]
    depends_on:
      - postgres
    # Loopback only: Adminer is an unauthenticated database console. Reach it
    # through an SSH tunnel rather than publishing it to the network.
    ports:
      # Bound to localhost only: Adminer has no auth of its own beyond the
      # Postgres password, so it should never be reachable from the network,
      # only from the host itself (e.g. via an SSH tunnel). If you need
      # remote access, tunnel in rather than widening this binding.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  # Database backups. A named volume rather than a bind mount so the files
  # keep their restrictive permissions and are not readable by whoever happens
  # to own the host directory.
  sentinel_backups:
  postgres_data:
